<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
  <title id="title">Total tokens for the paired review</title>
  <desc id="desc">Both reviews found both defects. Amber represents prompt tokens and sage represents generated tokens, on a shared scale.</desc>
  <defs>
    <pattern id="perfs" width="34" height="12" patternUnits="userSpaceOnUse"><rect x="7" y="2" width="18" height="8" rx="2" fill="#a7afa9"/></pattern>
  </defs>
  <rect width="960" height="224" rx="14" fill="#17221f"/>
  <path d="M14 12h932v12H14z M14 200h932v12H14z" fill="url(#perfs)"/>

  <style>
    text { fill: #17221f; font-family: system-ui, sans-serif }
    .label, .note { fill: #374f47; font-family: ui-monospace, monospace; font-size: 15px }
    .value { font-size: 30px; font-weight: bold }
  </style>
  <rect x="22" y="38" width="448" height="146" rx="4" fill="#f5f0df"/>
  <text class="label" x="42" y="66">01 / BASELINE REVIEW</text>
  <text class="value" x="42" y="108">2,620 tokens</text>
  <text class="note" x="42" y="140">188 prompt + 2,432 generated</text>
  <rect x="42" y="154" width="408" height="10" rx="3" fill="#e2dfd0"/>
  <rect x="42" y="154" width="29.2763" height="10" rx="0" fill="#f6c69e"/>
  <rect x="71.27633587786259" y="154" width="378.724" height="10" rx="0" fill="#81958b"/>
  <rect x="490" y="38" width="448" height="146" rx="4" fill="#f5f0df"/>
  <text class="label" x="510" y="66">02 / GUIDED REVIEW</text>
  <text class="value" x="510" y="108">1,801 tokens</text>
  <text class="note" x="510" y="140">318 prompt + 1,483 generated</text>
  <rect x="510" y="154" width="408" height="10" rx="3" fill="#e2dfd0"/>
  <rect x="510" y="154" width="49.5206" height="10" rx="0" fill="#f6c69e"/>
  <rect x="559.5206106870229" y="154" width="230.94" height="10" rx="0" fill="#81958b"/>
</svg>
