name: Release plugins

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build plugins
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected tag v$version for the current plugin version." >&2
            exit 1
          fi
          corepack enable
          pnpm install --frozen-lockfile
          pnpm plugins:pack
      - name: Create download
        working-directory: dist/plugins
        run: zip -qr ../contactsheet-plugins.zip .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/contactsheet-plugins.zip --verify-tag --generate-notes
